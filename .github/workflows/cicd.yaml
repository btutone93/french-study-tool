name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --engine-strict=false

      # - name: Run Workspace Tests
      #   run: npx turbo run test

      - name: Validate CDK Synthesis
        run: npx cdk synth --app "npx tsx packages/cdk/bin/cdk.ts"

  deploy:
    name: Deploy Infrastructure & Frontend
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --engine-strict=false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Vite Web App
        run: npm run build --workspace=web

      - name: Deploy CDK Infrastructure
        # env:
        #   SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        #   SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        #   GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx cdk deploy --app "npx tsx packages/cdk/bin/cdk.ts" --require-approval never